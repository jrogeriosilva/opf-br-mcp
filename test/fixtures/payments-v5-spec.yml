openapi: 3.0.0
info:
  title: API Payment Initiation - Open Finance Brasil
  version: 5.0.0
paths:
  /consents:
    post:
      tags: [Consents]
      summary: Criar consentimento para a iniciação de pagamento.
      description: Método de criação do consentimento para a iniciação de pagamento.
      requestBody:
        content:
          application/jwt:
            schema:
              $ref: '#/components/schemas/CreatePaymentConsent'
      responses:
        '201':
          $ref: '#/components/responses/201PaymentsConsentsConsentCreated'
  /consents/{consentId}:
    get:
      tags: [Consents]
      summary: Consultar consentimento para iniciação de pagamento.
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
  /pix/payments:
    post:
      tags: [Payments]
      summary: Criar iniciação de pagamento.
      description: Cria a iniciação de pagamento PIX consentida.
      requestBody:
        content:
          application/jwt:
            schema:
              $ref: '#/components/schemas/CreatePixPayment'
components:
  schemas:
    CreatePaymentConsent:
      type: object
      description: Payload de criação de consentimento de pagamento
      required: [data]
      properties:
        data:
          type: object
    CreatePixPayment:
      type: object
      description: Payload de criação de pagamento PIX
      required: [data]
      properties:
        data:
          type: object
    X-V:
      type: string
      description: Versão da API implementada pela instituição
      pattern: '^\d+\.\d+\.\d+$'
  headers:
    X-V:
      description: Cabeçalho que indica a versão implementada da API pela instituição financeira.
      required: true
      schema:
        $ref: '#/components/schemas/X-V'
  responses:
    201PaymentsConsentsConsentCreated:
      description: Consentimento de pagamento criado com sucesso.
      headers:
        x-v:
          $ref: '#/components/headers/X-V'

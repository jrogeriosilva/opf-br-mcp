openapi: 3.0.0
info:
  title: API Accounts - Open Finance Brasil
  description: "API de contas de depósito à vista, contas de poupança e contas pré-pagas do Open Finance\
    \ Brasil – Fase 2.\nAPI que retorna informações de contas de depósito à vista, contas de poupança\
    \ e contas de pagamento pré-pagas mantidas nas instituições transmissoras por seus clientes,\nincluindo\
    \ dados de identificação da conta, saldos, limites e transações.\\\nNão possui segregação entre pessoa\
    \ natural e pessoa jurídica.\\\nRequer consentimento do cliente para todos os `endpoints`.\n\n# Orientações\n\
    A `Role`  do diretório de participantes relacionada à presente API é a `DADOS`.\\\nPara todos os `endpoints`\
    \ desta API é previsto o envio de um `token` através do header `Authorization`.\\\nEste token deverá\
    \ estar relacionado ao consentimento (`consentId`) mantido na instituição transmissora dos dados,\
    \ o qual permitirá a pesquisa e retorno, na API em questão, dos \ndados relacionados ao `consentId`\
    \ específico relacionado.\\\nOs dados serão devolvidos na consulta desde que o `consentId` relacionado\
    \ corresponda a um consentimento válido e com o status `AUTHORISED`.\\\nÉ também necessário que o\
    \ recurso em questão (conta, contrato, etc) esteja disponível na instituição transmissora (ou seja,\
    \ sem boqueios de qualquer natureza e com todas as autorizações/consentimentos já autorizados).\\\n\
    Além disso as `permissions` necessárias deverão ter sido solicitadas quando da criação do consentimento\
    \ relacionado (`consentId`).\\\nRelacionamos a seguir as `permissions` necessárias para a consulta\
    \ de dados em cada `endpoint` da presente API.\n\n## Permissions necessárias para a API Accounts\n\
    \nPara cada um dos paths desta API, além dos escopos (`scopes`) indicados existem `permissions` que\
    \ deverão ser observadas:\n\n### `/accounts`\n  - permissions:\n    - GET: **ACCOUNTS_READ**\n###\
    \ `/accounts/{accountId}`\n  - permissions:\n    - GET: **ACCOUNTS_READ**\n### `/accounts/{accountId}/balances`\n\
    \  - permissions:\n    - GET: **ACCOUNTS_BALANCES_READ**\n### `/accounts/{accountId}/transactions`\n\
    \  - permissions:\n    - GET: **ACCOUNTS_TRANSACTIONS_READ**\n### `/accounts/{accountId}/transactions-current`\n\
    \  - permissions:\n    - GET: **ACCOUNTS_TRANSACTIONS_READ**\n### `/accounts/{accountId}/overdraft-limits`\n\
    \  - permissions:\n    - GET: **ACCOUNTS_OVERDRAFT_LIMITS_READ**\n\n## Data de imutabilidade por tipo\
    \ de transação​\nO identificador de transações de contas é de envio obrigatório no Open Finance Brasil.\
    \ De acordo com o tipo da transação deve haver o envio de um identificador único, estável e imutável\
    \ em D0 ou D+1, conforme tabela abaixo\n```\n|---------------------------------------|-------------------------|-----------------------|\n\
    | Tipo de Transação                     | Data da Obrigatoriedade | Data da Imutabilidade |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | TED                                   | DO                      | DO                    |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | PIX                                   | DO                      | DO                    |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | TRANSFERENCIA MESMA INSTITUIÇÃO (TEF) | DO                      | DO                    |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | TARIFA SERVIÇOS AVULSOS               | DO                      | DO                    |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | FOLHA DE PAGAMENTO                    | DO                      | DO                    |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | DOC                                   | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | BOLETO                                | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | CONVÊNIO ARRECADAÇÃO                  | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | PACOTE TARIFA SERVIÇOS                | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | DEPÓSITO                              | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | SAQUE                                 | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | CARTÃO                                | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | ENCARGOS JUROS CHEQUE ESPECIAL        | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | RENDIMENTO APLICAÇÃO FINANCEIRA       | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | PORTABILIDADE SALÁRIO                 | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | RESGATE APLICAÇÃO FINANCEIRA          | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | OPERAÇÃO DE CRÉDITO                   | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    | OUTROS                                | DO                      | D+1                   |\n|---------------------------------------|-------------------------|-----------------------|\n\
    ```\n\nPara consultar as regras aplicáveis ao comportamento do transacionID de acordo com o status\
    \ da transação, consultar a página [Orientações - Contas](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/193658890)\n"
  version: 2.4.2
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Governança do Open Finance Brasil – Especificações
    email: gt-interfaces@openbankingbr.org
    url: https://openbanking-brasil.github.io/areadesenvolvedor/
paths:
  /accounts:
    get:
      tags:
      - Accounts
      summary: Obtém a lista de contas consentidas pelo cliente.
      operationId: accountsGetAccounts
      description: Método para obter a lista de contas depósito à vista, poupança e pagamento pré-pagas
        mantidas pelo cliente na instituição transmissora e para as quais ele tenha fornecido consentimento.
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/xFapiAuthDate'
      - $ref: '#/components/parameters/xFapiCustomerIpAddress'
      - $ref: '#/components/parameters/xFapiInteractionId'
      - $ref: '#/components/parameters/xCustomerUserAgent'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/accountType'
      - $ref: '#/components/parameters/pagination-key'
      responses:
        '200':
          $ref: '#/components/responses/OKResponseAccountList'
        '400':
          $ref: '#/components/responses/BadRequestWithAdditionalProperties'
        '401':
          $ref: '#/components/responses/UnauthorizedWithAdditionalProperties'
        '403':
          $ref: '#/components/responses/ForbiddenWithAdditionalProperties'
        '404':
          $ref: '#/components/responses/NotFoundWithAdditionalProperties'
        '405':
          $ref: '#/components/responses/MethodNotAllowedWithAdditionalProperties'
        '406':
          $ref: '#/components/responses/NotAcceptableWithAdditionalProperties'
        '422':
          $ref: '#/components/responses/UnprocessableEntityWithAdditionalProperties'
        '423':
          $ref: '#/components/responses/LockedWithAdditionalProperties'
        '429':
          $ref: '#/components/responses/TooManyRequestsWithAdditionalProperties'
        '500':
          $ref: '#/components/responses/InternalServerErrorWithAdditionalProperties'
        '504':
          $ref: '#/components/responses/GatewayTimeoutWithAdditionalProperties'
        '529':
          $ref: '#/components/responses/SiteIsOverloadedWithAdditionalProperties'
        default:
          $ref: '#/components/responses/DefaultWithAdditionalProperties'
      security:
      - OpenId:
        - openid
        OAuth2Security:
        - consent:consentId
        - accounts
  /accounts/{accountId}/balances:
    get:
      tags:
      - Accounts
      summary: Obtém os saldos da conta identificada por accountId.
      operationId: accountsGetAccountsAccountIdBalances
      description: Método para obter os saldos da conta de depósito à vista, poupança ou pagamento pré-paga
        identificada por accountId mantida pelo cliente na instituição transmissora.
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/xFapiAuthDate'
      - $ref: '#/components/parameters/xFapiCustomerIpAddress'
      - $ref: '#/components/parameters/xFapiInteractionId'
      - $ref: '#/components/parameters/xCustomerUserAgent'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/OKResponseAccountBalances'
        '400':
          $ref: '#/components/responses/BadRequestWithAdditionalProperties'
        '401':
          $ref: '#/components/responses/UnauthorizedWithAdditionalProperties'
        '403':
          $ref: '#/components/responses/ForbiddenWithAdditionalProperties'
        '404':
          $ref: '#/components/responses/NotFoundWithAdditionalProperties'
        '405':
          $ref: '#/components/responses/MethodNotAllowedWithAdditionalProperties'
        '406':
          $ref: '#/components/responses/NotAcceptableWithAdditionalProperties'
        '422':
          $ref: '#/components/responses/UnprocessableEntityWithAdditionalProperties'
        '423':
          $ref: '#/components/responses/LockedWithAdditionalProperties'
        '429':
          $ref: '#/components/responses/TooManyRequestsWithAdditionalProperties'
        '500':
          $ref: '#/components/responses/InternalServerErrorWithAdditionalProperties'
        '504':
          $ref: '#/components/responses/GatewayTimeoutWithAdditionalProperties'
        '529':
          $ref: '#/components/responses/SiteIsOverloadedWithAdditionalProperties'
        default:
          $ref: '#/components/responses/DefaultWithAdditionalProperties'
      security:
      - OpenId:
        - openid
        OAuth2Security:
        - consent:consentId
        - accounts
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: Cabeçalho HTTP padrão. Permite que as credenciais sejam fornecidas dependendo do tipo
        de recurso solicitado
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        maxLength: 2048
    accountId:
      name: accountId
      in: path
      description: Identificador da conta de depósito à vista, de poupança ou de pagamento pré-paga.
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
        maxLength: 100
    accountType:
      name: accountType
      description: Tipos de contas. Modalidades tradicionais previstas pela Resolução 4.753, não contemplando
        contas vinculadas, conta de domiciliados no exterior, contas em moedas estrangeiras e conta correspondente
        moeda eletrônica. Vide Enum.
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/EnumAccountType'
    page:
      name: page
      in: query
      description: Número da página que está sendo requisitada (o valor da primeira página é 1).
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 2147483647
        format: int32
    pageSize:
      name: page-size
      in: query
      description: Quantidade total de registros por páginas.
      schema:
        type: integer
        default: 25
        minimum: 1
        format: int32
        maximum: 1000
    pagination-key:
      name: pagination-key
      in: query
      description: Identificador de rechamada, utilizado para evitar a contagem de chamadas ao endpoint
        durante a paginação.
      schema:
        type: string
        maxLength: 2048
        pattern: '[\w\W\s]*'
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indica o user-agent que o usuário utiliza.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Data em que o usuário logou pela última vez com o receptor. Representada de acordo
        com a [RFC7231](https://tools.ietf.org/html/rfc7231).Exemplo: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)
          \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: O endereço IP do usuário se estiver atualmente logado com o receptor.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: Um UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como um ID de correlação
        entre request e response. Campo de geração e envio obrigatório pela receptora (client) e o seu
        valor deve ser “espelhado” pela transmissora (server) no cabeçalho de resposta. Caso não seja
        recebido ou se for recebido um valor inválido, a transmissora deve gerar um x-fapi-interaction-id
        e retorná-lo na resposta com o HTTP Status Code 400. A receptora deve acatar o valor recebido
        da transmissora.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
  responses:
    BadRequestWithAdditionalProperties:
      description: A requisição foi malformada, omitindo atributos obrigatórios, seja no payload ou através
        de atributos na URL.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    DefaultWithAdditionalProperties:
      description: Erro inesperado.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    ForbiddenWithAdditionalProperties:
      description: O token tem escopo incorreto ou uma política de segurança foi violada
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    GatewayTimeoutWithAdditionalProperties:
      description: GATEWAY TIMEOUT - A requisição não foi atendida dentro do tempo limite estabelecido
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    InternalServerErrorWithAdditionalProperties:
      description: Ocorreu um erro no gateway da API ou no microsserviço
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    LockedWithAdditionalProperties:
      description: Locked
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    MethodNotAllowedWithAdditionalProperties:
      description: O consumidor tentou acessar o recurso com um método não suportado
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    NotAcceptableWithAdditionalProperties:
      description: A solicitação continha um cabeçalho Accept diferente dos tipos de mídia permitidos
        ou um conjunto de caracteres diferente de UTF-8
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    NotFoundWithAdditionalProperties:
      description: O recurso solicitado não existe ou não foi implementado
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    OKResponseAccountBalances:
      description: Dados relativos aos saldos da conta identificada por accountId obtidos com sucesso.
      headers:
        x-fapi-interaction-id:
          required: true
          description: Um UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como um ID de correlação
            entre request e response. Campo de geração e envio obrigatório pela receptora (client) e o
            seu valor deve ser “espelhado” pela transmissora (server) no cabeçalho de resposta. Caso não
            seja recebido ou se for recebido um valor inválido, a transmissora deve gerar um x-fapi-interaction-id
            e retorná-lo na resposta com o HTTP Status Code 400. A receptora deve acatar o valor recebido
            da transmissora.
          schema:
            $ref: '#/components/schemas/XFapiInteractionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseAccountBalances'
    OKResponseAccountList:
      description: Dados de identificação das contas obtidos com sucesso.
      headers:
        x-fapi-interaction-id:
          required: true
          description: Um UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como um ID de correlação
            entre request e response. Campo de geração e envio obrigatório pela receptora (client) e o
            seu valor deve ser “espelhado” pela transmissora (server) no cabeçalho de resposta. Caso não
            seja recebido ou se for recebido um valor inválido, a transmissora deve gerar um x-fapi-interaction-id
            e retorná-lo na resposta com o HTTP Status Code 400. A receptora deve acatar o valor recebido
            da transmissora.
          schema:
            $ref: '#/components/schemas/XFapiInteractionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseAccountList'
    SiteIsOverloadedWithAdditionalProperties:
      description: O site está sobrecarregado e a operação foi recusada, pois foi atingido o limite máximo
        de TPS global, neste momento.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    TooManyRequestsWithAdditionalProperties:
      description: A operação foi recusada, pois muitas solicitações foram feitas dentro de um determinado
        período ou o limite global de requisições concorrentes foi atingido
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    UnauthorizedWithAdditionalProperties:
      description: Cabeçalho de autenticação ausente/inválido ou token inválido
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    UnprocessableEntityWithAdditionalProperties:
      description: A sintaxe da requisição esta correta, mas não foi possível processar as instruções
        presentes.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'

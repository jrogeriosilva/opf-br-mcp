openapi: 3.0.0
info:
  title: API Resources - Open Finance Brasil
  description: "API que trata da consulta do status de recursos para o Open Finance Brasil - Dados cadastrais\
    \ e transacionais.\\\nNão possui segregação entre pessoa natural e pessoa jurídica.\n\n# Orientações\
    \ importantes\n- A API resources lista os recursos vinculados ao consentimento específico, identificado\
    \ por `consentId` e vinculado ao token enviado no header `Authorization`.\n- A API Resources somente\
    \ está disponível para consentimentos que se encontram no status `AUTHORISED`.\n- Os `STATUS` dos\
    \ recursos listados DEVEM considerar não apenas o consentimento vinculado mas também a disponibilidade\
    \ do recurso na instituição transmissora dos dados.\n- A `permission` específica desta API  - `RESOURCES_READ`\
    \ - DEVE ser solicitada pela instituição receptora na ocasião do pedido de criação do consentimento.\n\
    - O identificador do recurso devolvido na API Resources - `resourceId` - quando apresentado corresponde\
    \ ao mesmo identificador designado para o recurso em sua API específica, o seja: o `resourceId` corresponde\
    \ ao `accountId` da API accounts, ao `creditCardAccountId` da API de conta\npós-paga e assim sucessivamente.\n\
    \n## Status previstos para os recursos listados na API Resources\n- AVAILABLE: indica que o recurso\
    \ encontra-se disponível e o(s) consentimento(s) associado(s) possui(em) status `AUTHORISED`.\n- UNAVAILABLE:\
    \ indica que o recurso não está mais disponível, por exemplo, em caso de uma conta encerrada.\n- TEMPORARILY_UNAVAILABLE:\
    \ indica que o recurso encontra-se temporariamente indisponível, embora o(s) consentimento(s) associado(s)\
    \ possua(m) status `AUTHORISED`.  \nCaso de exemplo: conta temporariamente bloqueada por suspeita\
    \ de fraude.\n- PENDING_AUTHORISATION: indica a existência de pendências para o compartilhamento do\
    \ recurso, por exemplo, em caso de alçada dupla, quando é necessário o consentimento de mais de um\
    \ titular.\n\n## Permissions necessárias para a API Resources\n### `/resources`\n  - permissions:\n\
    \    - GET: **RESOURCES_READ**\n"
  version: 3.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Governança do Open Finance Brasil – Especificações
    email: gt-interfaces@openbankingbr.org
    url: https://openbanking-brasil.github.io/areadesenvolvedor/
paths:
  /resources:
    get:
      tags:
      - Resources
      summary: Obtém a lista de recursos consentidos pelo cliente.
      operationId: resourcesGetResources
      description: Método para obter a lista de recursos mantidos pelo cliente na instituição transmissora
        e para as quais ele tenha fornecido consentimento.
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/xFapiAuthDate'
      - $ref: '#/components/parameters/xFapiCustomerIpAddress'
      - $ref: '#/components/parameters/xFapiInteractionId'
      - $ref: '#/components/parameters/xCustomerUserAgent'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          $ref: '#/components/responses/OKResponseResourceList'
        '202':
          $ref: '#/components/responses/202ResponseResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '529':
          $ref: '#/components/responses/SiteIsOverloaded'
        default:
          $ref: '#/components/responses/Default'
      security:
      - OpenId:
        - openid
        OAuth2Security:
        - consent:consentId
        - resources
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: Cabeçalho HTTP padrão. Permite que as credenciais sejam fornecidas dependendo do tipo
        de recurso solicitado
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        maxLength: 2048
    page:
      name: page
      in: query
      description: Número da página que está sendo requisitada (o valor da primeira página é 1).
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 2147483647
        format: int32
    pageSize:
      name: page-size
      in: query
      description: "Quantidade total de registros por páginas. \nA transmissora deve considerar entrada\
        \ como 25, caso seja informado algum valor menor pela receptora. \nEnquanto houver mais que 25\
        \ registros a enviar, a transmissora deve considerar o mínimo por página como 25. \nSomente a\
        \ última página retornada (ou primeira, no caso de página única) pode conter menos de 25 registros.\
        \ \nMais informações, acesse Especificações de APIs > Padrões > Paginação.\n"
      schema:
        type: integer
        default: 25
        minimum: 25
        format: int32
        maximum: 1000
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indica o user-agent que o usuário utiliza.
      required: false
      schema:
        type: string
        pattern: ^[^\s](.*[^\s])?$
        minLength: 1
        maxLength: 255
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Data em que o usuário logou pela última vez com o receptor. Representada de acordo
        com a [RFC7231](https://tools.ietf.org/html/rfc7231).Exemplo: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)
          \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: O endereço IP do usuário se estiver atualmente logado com o receptor.
      required: false
      schema:
        type: string
        pattern: ^[^\s](.*[^\s])?$
        minLength: 1
        maxLength: 255
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: Um UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como um ID de correlação
        entre request e response. Campo de geração e envio obrigatório pela receptora (client) e o seu
        valor deve ser “espelhado” pela transmissora (server) no cabeçalho de resposta. Caso não seja
        recebido ou se for recebido um valor inválido, a transmissora deve gerar um x-fapi-interaction-id
        e retorná-lo na resposta com o HTTP Status Code 400. A receptora deve acatar o valor recebido
        da transmissora.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
  responses:
    202ResponseResource:
      description: Requisição foi recebida.
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/xFapiInteractionId'
        x-v:
          $ref: '#/components/headers/X-V'
    BadRequest:
      description: A requisição foi malformada, omitindo atributos obrigatórios, seja no payload ou através
        de atributos na URL.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    Default:
      description: Erro inesperado.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    Forbidden:
      description: O token tem escopo incorreto ou uma política de segurança foi violada
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    GatewayTimeout:
      description: GATEWAY TIMEOUT - A requisição não foi atendida dentro do tempo limite estabelecido
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    InternalServerError:
      description: Ocorreu um erro no gateway da API ou no microsserviço
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    MethodNotAllowed:
      description: O consumidor tentou acessar o recurso com um método não suportado
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    NotAcceptable:
      description: A solicitação continha um cabeçalho Accept diferente dos tipos de mídia permitidos
        ou um conjunto de caracteres diferente de UTF-8
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    NotFound:
      description: O recurso solicitado não existe ou não foi implementado
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    OKResponseResourceList:
      description: Dados de status dos recursos obtidos com sucesso.
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/xFapiInteractionId'
        x-v:
          $ref: '#/components/headers/X-V'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseResourceList'
    SiteIsOverloaded:
      description: O site está sobrecarregado e a operação foi recusada, pois foi atingido o limite máximo
        de TPS global, neste momento.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    TooManyRequests:
      description: A operação foi recusada, pois muitas solicitações foram feitas dentro de um determinado
        período ou o limite global de requisições concorrentes foi atingido
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    Unauthorized:
      description: Cabeçalho de autenticação ausente/inválido ou token inválido
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
    UnprocessableEntity:
      description: A sintaxe da requisição esta correta, mas não foi possível processar as instruções
        presentes.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseErrorWithAbleAdditionalProperties'
